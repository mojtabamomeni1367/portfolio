name: Publish analyses

on:
  push:
    paths:
      - "content/analyses/**"
      - "scripts/build_analyses.py"
      - "scripts/build_langs.py"
      - "index.html"
      - "scripts/notify_search.py"
      - ".github/workflows/build-analyses.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pyyaml
      - name: Build analysis and topic pages
        run: python scripts/build_analyses.py
      - name: Build Persian and Arabic home pages
        run: python scripts/build_langs.py
      - name: Save changes
        run: |
          git config user.name "analysis-bot"
          git config user.email "analysis-bot@users.noreply.github.com"
          git add -A analysis analyses topic fa ar data/analyses.json data/analyses_order.json sitemap.xml
          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "Publish analyses"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
      - name: Tell search engines about new or changed pages
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          WAIT_FOR_DEPLOY: "120"
        run: |
          pip install -q google-auth requests
          python scripts/notify_search.py
          for f in data/search_ping.json data/index_status.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "Nothing new to record."
          else
            git commit -m "Search engines notified"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
