name: Publish analyses

on:
  push:
    paths:
      - "content/analyses/**"
      - "scripts/build_analyses.py"
      - "scripts/build_langs.py"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pyyaml
      - name: Build analysis and topic pages
        run: python scripts/build_analyses.py
      - name: Build Persian and Arabic home pages
        run: python scripts/build_langs.py
      - name: Save changes
        run: |
          git config user.name "analysis-bot"
          git config user.email "analysis-bot@users.noreply.github.com"
          git add -A analysis analyses topic fa ar data/analyses.json sitemap.xml
          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "Publish analyses"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
